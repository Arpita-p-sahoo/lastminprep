<div class="min-h-screen flex flex-col animate-fade-up">
  <nav class="topnav">
    <a routerLink="/" class="flex items-center gap-2 no-underline">
      <div class="logo-mark" aria-label="LastMinPrep">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M6 5h4v14h10v3H6z" />
        </svg>
      </div>
      <div class="logo-text">last<span>min</span>prep</div>
    </a>
    <div class="flex items-center gap-2">
      <button class="icon-btn" (click)="theme.toggle()">
        <span class="mi">{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</span>
      </button>
      @if (!auth.isLoggedIn()) {
      <button class="nbtn ghost" routerLink="/login">Log in</button>
      <button class="nbtn solid" routerLink="/signup">Sign up free</button>
      } @else {
      <button class="nbtn solid" routerLink="/dashboard">Dashboard →</button>
      }
    </div>
  </nav>

  <div class="hero-wrap">
    <div class="hero-left">
      <div class="hero-badge">
        <span class="badge-dot"></span> #1 Interview Prep Community
      </div>
      <h1 class="hero-title">
        Crack your next<br>
        <span class="text-accent">tech interview</span><br>
        in minutes.
      </h1>
      <p class="hero-sub">
        Community-curated interview prep.
        Post questions, vote & comment, track your streak, and explore jobs.
      </p>
      <div class="hero-btns">
        <button class="btn-lmp btn-primary" routerLink="/signup">Start preparing free →</button>
        <button class="btn-lmp btn-secondary" routerLink="/explore">Browse questions</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <span class="tag tag-tech">Post questions</span>
        <span class="tag tag-tech">Vote & comment</span>
        <span class="tag tag-tech">Daily streak</span>
        <span class="tag tag-tech">Jobs board</span>
      </div>
    </div>
  </div>
</div>
