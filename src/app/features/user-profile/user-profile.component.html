
    <app-post-modal [open]="postOpen()" (close)="postOpen.set(false)" />
    <div class="flex flex-col min-h-screen animate-fade-up">
      <app-navbar (drawerOpen)="drawerOpen.set(true)" />
      <app-drawer [open]="drawerOpen()" (close)="drawerOpen.set(false)" />
      <div class="main-layout">
        <app-sidebar />
        <div class="content">
          <div class="content-inner">
            <div class="lmp-card" style="padding:1rem;margin-bottom:1rem;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="profile-ava-img">{{ userName.charAt(0) }}</div>
                <div>
                  <div class="profile-name">{{ userName }}</div>
                  <div class="profile-title-txt">{{ questions().length }} questions · {{ totalVotes }} votes</div>
                </div>
              </div>
            </div>
            <div class="feed-head"><h2>Posts by {{ userName }}</h2></div>
            @for (q of questions(); track q.id) {
              <app-question-card [question]="q" />
            }
            @if (!questions().length) {
              <div style="text-align:center;padding:2rem;color:var(--ink3);">No posts yet</div>
            }
          </div>
        </div>
      </div>
      <app-bottom-nav (postClick)="postOpen.set(true)" />
    </div>
