
    <app-post-modal [open]="p()" (close)="p.set(false)" />
    <div class="flex flex-col min-h-screen animate-fade-up">
      <app-navbar (drawerOpen)="d.set(true)" />
      <app-drawer [open]="d()" (close)="d.set(false)" />
      <div class="main-layout">
        <app-sidebar />
        <div class="content"><div class="content-inner">
          <div style="margin-bottom:1.5rem;"><div style="font-size:20px;font-weight:800;">Saved questions</div><div style="font-size:13px;color:var(--ink2);margin-top:3px;">Questions you bookmarked for later review.</div></div>
          @for (q of saved(); track q.id) { <app-question-card [question]="q" /> }
          @if (!saved().length) {
            <div style="text-align:center;padding:3rem;"><div style="font-size:48px;margin-bottom:1rem;opacity:0.4;">⭐</div><div style="font-size:16px;font-weight:600;margin-bottom:6px;">No saved questions</div><div style="font-size:13px;color:var(--ink3);">Bookmark questions to revisit them later.</div></div>
          }
        </div></div>
      </div>
      <app-bottom-nav (postClick)="p.set(true)" />
    </div>
