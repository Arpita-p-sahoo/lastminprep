
    <aside class="sidebar">

        <a class="sb-link" routerLink="/jobs" routerLinkActive="active"><span class="sb-icon">💼</span> Jobs <span class="sb-badge green">5</span></a>

            <div class="sb-user-name">{{ auth.currentUser()?.name }}</div>
