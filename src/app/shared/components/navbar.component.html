<nav class="topnav">
  <div class="flex items-center gap-2">
    <button class="icon-btn hamburger" (click)="drawerOpen.emit()"><span class="mi">menu</span></button>
    <a routerLink="/" class="flex items-center gap-2 no-underline">
      <div class="logo-mark" aria-label="LastMinPrep">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M6 5h4v14h10v3H6z" />
        </svg>
      </div>
      <div class="logo-text">last<span>min</span>prep</div>
    </a>
  </div>
  <div class="flex items-center gap-2">
    @if (auth.isLoggedIn()) {
    <button class="icon-btn relative" routerLink="/notifications" (click)="clearNotifications()">
      <span class="mi">notifications</span>
      @if (hasUnread()) {
      <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500 border border-white"></span>
      }
    </button>
    <div class="profile-wrap" #profileWrap>
      <button class="nav-ava" type="button" (click)="toggleMenu($event)">
        @if (auth.currentUser()?.avatar) {
        <img [src]="auth.currentUser()!.avatar" alt="avatar" />
        } @else {
        {{ auth.currentUser()?.name?.charAt(0) || 'U' }}
        }
      </button>
      @if (menuOpen()) {
      <div class="profile-menu" role="menu">
        <div class="menu-row" role="menuitem">
          <div class="menu-title">Theme</div>
          <button type="button" class="menu-toggle" [class.on]="theme.isDark()" (click)="toggleTheme($event)">
            <span class="knob"></span>
          </button>
        </div>
        <button type="button" class="menu-item" (click)="goSettings()">
          <span class="mi">settings</span>
          Settings
        </button>
        <button type="button" class="menu-item danger" (click)="logout()">
          <span class="mi">logout</span>
          Logout
        </button>
      </div>
      }
    </div>
    } @else {
    <div class="nav-btns flex gap-2">
      <button class="nbtn ghost" routerLink="/login">Log in</button>
      <button class="nbtn solid" routerLink="/signup">Sign up free</button>
    </div>
    }
  </div>
</nav>
