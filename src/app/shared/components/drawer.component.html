<div class="drawer-overlay" [class.open]="open()" (click)="close.emit()"></div>
<div class="drawer" [class.open]="open()">
  <div class="drawer-head">
    <a routerLink="/" class="flex items-center gap-2 no-underline" (click)="close.emit()">
      <div class="logo-mark" aria-label="LastMinPrep">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M6 5h4v14h10v3H6z" />
        </svg>
      </div>
      <div class="logo-text">last<span>min</span>prep</div>
    </a>
    <button class="drawer-close" (click)="close.emit()"><span class="mi">close</span></button>
  </div>
  <div class="drawer-body">
    <div class="sb-section">Main</div>
    <a class="sb-link" routerLink="/dashboard" (click)="close.emit()"><span class="mi">dashboard</span> Dashboard</a>
    <a class="sb-link" routerLink="/feed" (click)="close.emit()"><span class="mi">dynamic_feed</span> Feed @if (qs.newFeedCount() > 0) { <span class="sb-badge">{{ qs.newFeedCount() }}</span> }</a>
    <a class="sb-link" routerLink="/explore" (click)="close.emit()"><span class="mi">explore</span> Explore</a>
    <a class="sb-link" routerLink="/jobs" (click)="close.emit()"><span class="mi">work</span> Jobs</a>
    <a class="sb-link" routerLink="/leaderboard" (click)="close.emit()"><span class="mi">leaderboard</span>
      Leaderboard</a>
    <a class="sb-link" routerLink="/search" (click)="close.emit()"><span class="mi">search</span> Search</a>
    <div class="sb-section">You</div>
    <a class="sb-link" routerLink="/profile" (click)="close.emit()"><span class="mi">person</span> Profile</a>
    <a class="sb-link" routerLink="/saved" (click)="close.emit()"><span class="mi">bookmark</span> Saved</a>
    <a class="sb-link" routerLink="/my-questions" (click)="close.emit()"><span class="mi">quiz</span> My Questions</a>
    <a class="sb-link" routerLink="/notifications" (click)="close.emit()"><span class="mi">notifications</span>
      Notifications</a>
    <div class="sb-section">Account</div>
    <a class="sb-link" routerLink="/settings" (click)="close.emit()"><span class="mi">settings</span> Settings</a>
    <button class="sb-link" (click)="auth.logout(); close.emit()"><span class="mi">logout</span> Logout</button>
  </div>
</div>
