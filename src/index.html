<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LastMinPrep — Crack your next tech interview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Community-curated, highly-rated interview questions sorted by tech stack. Post, rate, and discover what's actually being asked in 2026.">
  <meta name="theme-color" content="#5b4ff5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LastMinPrep">

  <!-- Open Graph -->
  <meta property="og:title" content="LastMinPrep — Crack your next tech interview">
  <meta property="og:description" content="Community-curated interview questions sorted by tech stack. Join 4,000+ developers preparing smarter.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lastminprep.dev">
  <meta property="og:image" content="https://lastminprep.dev/assets/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LastMinPrep — Crack your next tech interview">
  <meta name="twitter:description" content="Community-curated interview questions sorted by tech stack.">
  <meta name="twitter:image" content="https://lastminprep.dev/assets/og-image.png">

  <!-- Canonical -->
  <link rel="canonical" href="https://lastminprep.dev">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    (() => {
      try {
        const saved = localStorage.getItem('lmp_theme');
        const dark = saved ? saved === 'dark' : true;
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] font-sans">
  <app-root></app-root>
</body>
</html>
